---
AWSTemplateFormatVersion: '2010-09-09'
Description: Template para criar Bucket S3 (Bronze) e Lambda com Function URL para upload seguro via HTTPS.

Resources:
  # 1. Bucket S3 - Camada Bronze
  BronzeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 
        Fn::Sub: "bronze-layer-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    DeletionPolicy: Retain

  # 2. Função Lambda (usa a LabRole pré-existente)
  GenerateUploadUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: BronzeGetUploadUrlFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: 
        Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Timeout: 30
      Environment:
        Variables:
          BUCKET_NAME: 
            Ref: BronzeBucket
      Code:
        ZipFile: |
          import json
          import boto3
          import base64
          import os

          s3 = boto3.client('s3')
          BUCKET_NAME = os.environ['BUCKET_NAME']

          def lambda_handler(event, context):
            try:
              query_params = event.get('queryStringParameters') or {}
              file_name = query_params.get('filename')

              if not file_name:
                return {
                  'statusCode': 400,
                  'headers': {'Content-Type': 'application/json'},
                  'body': json.dumps({'error': 'O parametro filename e obrigatorio na URL (?filename=exemplo.txt)'})
              }

              # Obter o conteúdo do arquivo vindo no corpo da requisição POST
              body = event.get('body', '')

              # Tratar arquivos binários / base64
              if event.get('isBase64Encoded', False):
                file_content = base64.b64decode(body)
              else:
                file_content = body.encode('utf-8') if isinstance(body, str) else body

              # Salvar diretamente no Bucket S3 (camada Bronze)
              s3.put_object(
                Bucket=BUCKET_NAME,
                Key=f"{file_name}",
                Body=file_content
              )

              return {
                'statusCode': 200,
                'headers': {'Content-Type': 'application/json'},
                'body': json.dumps({'message': f'Arquivo raw/{file_name} salvo com sucesso no S3!'})
              }
            except Exception as e:
              return {
                'statusCode': 500,
                'headers': {'Content-Type': 'application/json'},
                'body': json.dumps({'error': str(e)})
              }

  # 3. Endpoint HTTPS nativo da Lambda (Function URL)
  LambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: 
        Fn::GetAtt:
          - GenerateUploadUrlFunction
          - Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST 
          - PUT

  # 4. Permissão para execução do Endpoint HTTPS da Lambda
  LambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: 
        Ref: GenerateUploadUrlFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  BronzeBucketName:
    Description: Nome do Bucket Bronze Criado
    Value: 
      Ref: BronzeBucket

  UploadApiEndpoint:
    Description: Endpoint HTTPS (Lambda Function URL) para solicitar URL de upload
    Value: 
      Fn::GetAtt:
        - LambdaUrl
        - FunctionUrl
...