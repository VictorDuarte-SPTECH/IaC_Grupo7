AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Infraestrutura principal da Lamar Auto Pecas: VPC em duas zonas de
  disponibilidade, instancias EC2, volume EBS, Application Load Balancer,
  bastion SSH, manager Docker Swarm, MySQL com recuperacao automatica entre
  AZs e dois brokers RabbitMQ independentes.

Parameters:
  EnvironmentName:
    Type: String
    Default: lamar-auto-pecas
    Description: Nome base utilizado nos recursos da aplicacao.
    MinLength: 1
    MaxLength: 25
    AllowedPattern: '[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?'
    ConstraintDescription: Use apenas letras, numeros e hifens, sem hifen no inicio ou no fim.

  InstanceType:
    Type: String
    Default: t3.small
    Description: Tipo das instancias EC2 da aplicacao e do banco.

  DockerHubNamespace:
    Type: String
    Default: guilhermebarros297
    Description: Usuario Docker Hub com as tres imagens publicas da aplicacao.
    AllowedPattern: '[a-z0-9][a-z0-9_-]*'

  ApplicationImageTag:
    Type: String
    Default: v1.0.0
    Description: Tag publicada para backend, frontend e etiquetas. O frontend deve usar /api.
    AllowedPattern: '[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}'

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Nome do par de chaves EC2 usado para acesso SSH e SFTP.

  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Nome do IAM instance profile associado as instancias EC2.
    MinLength: 1

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Parametro SSM que resolve a AMI mais recente do Ubuntu Server 24.04.

  RabbitMqUser:
    Type: String
    Default: lamar
    Description: Usuario da aplicacao para conexao com o RabbitMQ.
    MinLength: 1
    AllowedPattern: '[a-zA-Z0-9_-]+'

  RabbitMqPassword:
    Type: String
    NoEcho: true
    Description: Senha da aplicacao para conexao com o RabbitMQ.
    MinLength: 12
    AllowedPattern: '[a-zA-Z0-9._~!@#%^+=-]+'
    ConstraintDescription: Use ao menos 12 caracteres sem espacos.

  DatabaseName:
    Type: String
    Default: lamar
    AllowedValues: [lamar]
    Description: Nome do banco MySQL utilizado pela aplicacao.
    MinLength: 1
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'

  DatabaseUser:
    Type: String
    Default: lamar
    Description: Usuario MySQL utilizado pelas instancias backend.
    MinLength: 1
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'

  DatabasePassword:
    Type: String
    NoEcho: true
    Description: Senha MySQL utilizada pelas instancias backend.
    MinLength: 12
    AllowedPattern: '[a-zA-Z0-9._~!@#%^+=-]+'
    ConstraintDescription: Use ao menos 12 caracteres sem espacos.

  AdminPassword:
    Type: String
    NoEcho: true
    Description: Senha inicial de admin@teste.com para o login da aplicacao (nao e a senha do MySQL).
    MinLength: 12
    MaxLength: 72
    AllowedPattern: '[a-zA-Z0-9._~!@#%^+=-]+'
    ConstraintDescription: Use entre 12 e 72 caracteres sem espacos.

  JwtSecret:
    Type: String
    NoEcho: true
    Description: Chave aleatoria Base64 (ao menos 32 bytes decodificados) compartilhada pelas replicas do backend.
    MinLength: 44
    AllowedPattern: '[a-zA-Z0-9+/]+={0,2}'
    ConstraintDescription: Informe uma chave Base64 de ao menos 32 bytes decodificados.

Mappings:
  Bootstrap:
    Common:
      Script: |
        set -Eeuo pipefail
        BOOTSTRAP_STAGE=apt-update

        log_bootstrap() {
          printf '[%s] [%s] %s\n' "$(date -u +%FT%TZ)" "$BOOTSTRAP_RESOURCE" "$*" >&2
        }

        signal_bootstrap() {
          local status="$1"
          local payload
          payload=$(printf '{"Status":"%s","Reason":"%s: %s","UniqueId":"%s","Data":"%s"}' \
            "$status" "$BOOTSTRAP_RESOURCE" "$BOOTSTRAP_STAGE" "$BOOTSTRAP_RESOURCE" "$BOOTSTRAP_STAGE")
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --retry 2 --retry-delay 2 --retry-max-time 40 \
            --request PUT --header 'Content-Type:' \
            --data-binary "$payload" "$BOOTSTRAP_SIGNAL_URL"
        }

        finish_bootstrap() {
          local exit_status="$?"
          trap - EXIT
          if [ "$exit_status" -eq 0 ]; then
            BOOTSTRAP_STAGE=complete
            if ! signal_bootstrap SUCCESS; then
              log_bootstrap 'ERRO: nao foi possivel entregar o sinal de sucesso ao CloudFormation.'
              exit 1
            fi
          else
            log_bootstrap "ERRO: bootstrap interrompido na etapa $BOOTSTRAP_STAGE (codigo $exit_status)."
            if ! signal_bootstrap FAILURE; then
              log_bootstrap 'ERRO: sinal de falha nao entregue; a stack dependera do timeout. Confira NAT, rotas e acesso ao S3.'
            fi
          fi
          exit "$exit_status"
        }
        trap finish_bootstrap EXIT

        update_apt() {
          local deadline=$((SECONDS + 600))
          local attempt=0
          local remaining attempt_timeout retry_delay exit_status
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            remaining=$((deadline - SECONDS))
            attempt_timeout=60
            if (( remaining < attempt_timeout )); then
              attempt_timeout=$remaining
            fi
            log_bootstrap "APT: tentativa $attempt, timeout $attempt_timeout segundos, janela restante $remaining segundos."
            if timeout --signal=TERM --kill-after=5s "$attempt_timeout" \
              apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=0 \
                -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
                -o APT::Update::Error-Mode=any update; then
              log_bootstrap 'APT: todos os indices atualizados; iniciando instalacao.'
              return 0
            else
              exit_status=$?
              log_bootstrap "APT: tentativa $attempt falhou (codigo $exit_status); motivo registrado acima."
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              retry_delay=10
              if (( remaining < retry_delay )); then
                retry_delay=$remaining
              fi
              sleep "$retry_delay"
            fi
          done
          BOOTSTRAP_STAGE=apt-update-exhausted
          log_bootstrap 'ERRO: janela de 600 segundos do APT esgotada; nenhum pacote sera instalado.'
          return 1
        }

        install_packages() {
          BOOTSTRAP_STAGE=packages
          local deadline=$((SECONDS + 600))
          local attempt=0
          local remaining exit_status
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            remaining=$((deadline - SECONDS))
            log_bootstrap "APT install: tentativa $attempt, janela restante $remaining segundos."
            if timeout --signal=TERM --kill-after=10s "$remaining" \
              env DEBIAN_FRONTEND=noninteractive \
              apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
                -o DPkg::Lock::Timeout=120 install -y "$@"; then
              BOOTSTRAP_STAGE=configuration
              return 0
            else
              exit_status=$?
              log_bootstrap "APT install: tentativa $attempt falhou (codigo $exit_status)."
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              sleep 10
            fi
          done
          log_bootstrap 'ERRO: janela de 600 segundos da instalacao esgotada.'
          return "$exit_status"
        }

        install_aws_cli() {
          BOOTSTRAP_STAGE=aws-cli
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -oq /tmp/awscliv2.zip -d /tmp/awscli-install
          /tmp/awscli-install/aws/install --update
          BOOTSTRAP_STAGE=configuration
        }

        update_apt

Resources:
  BootstrapSignalHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  BootstrapWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Handle: !Ref BootstrapSignalHandle
      Timeout: '3600'
      Count: 10

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/25
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc-principal'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-gateway-internet'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.0/27
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-publica-az1'

  PublicSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.0.32/27
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-publica-az2'

  WebSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.64/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-web-az1'

  WebSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.0.80/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-web-az2'

  BackendSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.96/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-backend-az1'

  BackendSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.0.112/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-backend-az2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tabela-rotas-publica'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAz1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAz1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetAz2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAz2
      RouteTableId: !Ref PublicRouteTable

  NatEipAz1:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ip-elastico-nat-az1'

  NatEipAz2:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ip-elastico-nat-az2'

  NatGatewayAz1:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - PublicDefaultRoute
      - PublicSubnetAz1RouteTableAssociation
    Properties:
      AllocationId: !GetAtt NatEipAz1.AllocationId
      SubnetId: !Ref PublicSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-gateway-nat-az1'

  NatGatewayAz2:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - PublicDefaultRoute
      - PublicSubnetAz2RouteTableAssociation
    Properties:
      AllocationId: !GetAtt NatEipAz2.AllocationId
      SubnetId: !Ref PublicSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-gateway-nat-az2'

  PrivateRouteTableAz1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tabela-rotas-privada-az1'

  PrivateRouteTableAz2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tabela-rotas-privada-az2'

  PrivateDefaultRouteAz1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableAz1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayAz1

  PrivateDefaultRouteAz2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableAz2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayAz2

  WebSubnetAz1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetAz1
      RouteTableId: !Ref PrivateRouteTableAz1

  BackendSubnetAz1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref BackendSubnetAz1
      RouteTableId: !Ref PrivateRouteTableAz1

  WebSubnetAz2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetAz2
      RouteTableId: !Ref PrivateRouteTableAz2

  BackendSubnetAz2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref BackendSubnetAz2
      RouteTableId: !Ref PrivateRouteTableAz2

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite SSH da estacao administrativa ao bastion
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-bastion'

  PrivateSshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite SSH e SFTP nas instancias privadas somente pelo bastion
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-ssh-privado'

  SwarmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite comunicacao interna entre os nos Docker Swarm
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-docker-swarm'

  SwarmManagementIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: tcp
      FromPort: 2377
      ToPort: 2377
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  SwarmDiscoveryTcpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: tcp
      FromPort: 7946
      ToPort: 7946
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  SwarmDiscoveryUdpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: udp
      FromPort: 7946
      ToPort: 7946
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  SwarmOverlayIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: udp
      FromPort: 4789
      ToPort: 4789
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite HTTP da internet ao ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-alb'

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite HTTP do ALB aos frontends
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-web'

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite acesso dos frontends aos backends
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-backend'

  RabbitMqSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite AMQP somente a partir dos backends
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5672
          ToPort: 5672
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-rabbitmq'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite MySQL somente a partir dos backends
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-banco'

  DatabaseBackupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref DatabaseSecurityGroup

  DatabasePrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Sub '${EnvironmentName}.internal'
      VPCs:
        - VPCId: !Ref Vpc
          VPCRegion: !Ref AWS::Region

  DatabaseEndpointRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DatabasePrivateHostedZone
      Name: !Sub 'database.${EnvironmentName}.internal'
      Type: A
      TTL: '10'
      ResourceRecords:
        - !GetAtt DatabaseInstance.PrivateIp

  BastionInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicDefaultRoute
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref BastionSecurityGroup
          SubnetId: !Ref PublicSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-bastion-az1'
      UserData:
        Fn::Base64: !Sub
        - |
          #!/bin/bash
          BOOTSTRAP_RESOURCE=BastionInstance
          BOOTSTRAP_SIGNAL_URL='${BootstrapSignalHandle}'
          ${BootstrapScript}

        - BootstrapScript: !FindInMap [Bootstrap, Common, Script]

  BastionEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref BastionInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ip-elastico-bastion'

  SwarmManagerInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT60M
    DependsOn:
      - BackendSubnetAz1RouteTableAssociation
      - PrivateDefaultRouteAz1
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref BackendSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-swarm-manager-az1'
      UserData:
        Fn::Base64: !Sub
        - |
          #!/bin/bash
          BOOTSTRAP_RESOURCE=SwarmManagerInstance
          BOOTSTRAP_SIGNAL_URL='${BootstrapSignalHandle}'
          ${BootstrapScript}

          install_packages ca-certificates curl unzip python3 docker.io openssh-server
          install_aws_cli

          hostnamectl set-hostname swarm-manager-az1
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          PRIVATE_IP=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/meta-data/local-ipv4)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            docker swarm init --advertise-addr "$PRIVATE_IP" > /dev/null
          fi

          MANAGER_NODE_ID=$(docker info --format '{{.Swarm.NodeID}}')
          docker node update \
            --availability drain \
            --label-add tier=manager \
            --label-add zone=az1 \
            "$MANAGER_NODE_ID"

          WORKER_TOKEN=$(docker swarm join-token --quiet worker)
          aws ssm put-parameter \
            --region "$REGION" \
            --name '/${EnvironmentName}/swarm/manager-ip' \
            --type String \
            --value "$PRIVATE_IP" \
            --overwrite
          aws ssm put-parameter \
            --region "$REGION" \
            --name '/${EnvironmentName}/swarm/worker-token' \
            --type SecureString \
            --value "$WORKER_TOKEN" \
            --overwrite
          aws ssm put-parameter \
            --region "$REGION" \
            --name '/${EnvironmentName}/swarm/stack-id' \
            --type String \
            --value '${AWS::StackId}' \
            --overwrite

          umask 077
          printf '%s' '${DatabasePassword}' | docker secret create codetracker-db-password -
          printf '%s' '${RabbitMqPassword}' | docker secret create codetracker-rabbitmq-password -
          printf '%s' '${JwtSecret}' | docker secret create codetracker-jwt-secret -
          mkdir -p /opt/codetracker

          cat > /opt/codetracker/stack.yml <<'STACK'
          version: '3.8'
          services:
            backend:
              image: ${DockerHubNamespace}/codetracker-backend:${ApplicationImageTag}
              environment:
                DB_HOST: '${DatabaseEndpointRecord}'
                DB_NAME: '${DatabaseName}'
                DB_USERNAME: '${DatabaseUser}'
                SPRING_CONFIG_IMPORT: 'configtree:/run/secrets/'
                SPRING_RABBITMQ_ADDRESSES: '${RabbitMqInstance.PrivateIp}:5672,${RabbitMqInstanceAz2.PrivateIp}:5672'
                SPRING_RABBITMQ_USERNAME: '${RabbitMqUser}'
                SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: '10000'
                SPRING_DATASOURCE_HIKARI_VALIDATIONTIMEOUT: '5000'
                SPRING_DATASOURCE_HIKARI_MAXLIFETIME: '60000'
                JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65.0 -Dsun.net.inetaddr.ttl=10'
              secrets:
                - source: database_password
                  target: DB_PASSWORD
                - source: rabbitmq_password
                  target: spring.rabbitmq.password
                - source: jwt_secret
                  target: JWT_SECRET
              networks:
                application:
                  aliases: [backend]
              deploy:
                replicas: 4
                endpoint_mode: vip
                placement:
                  constraints: [node.labels.tier == backend]
                  max_replicas_per_node: 2
                resources:
                  limits:
                    memory: 768M
                restart_policy:
                  condition: any
                  delay: 10s
            etiquetas:
              image: ${DockerHubNamespace}/codetracker-etiquetas:${ApplicationImageTag}
              environment:
                BACKEND_API_BASE_URL: 'http://backend:8080'
                JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65.0'
              networks:
                application:
                  aliases: [etiquetas]
              deploy:
                replicas: 1
                placement:
                  constraints: [node.labels.tier == backend]
                resources:
                  limits:
                    memory: 512M
                restart_policy:
                  condition: any
                  delay: 10s
            frontend:
              image: ${DockerHubNamespace}/codetracker-frontend:${ApplicationImageTag}
              ports:
                - target: 80
                  published: 80
                  protocol: tcp
                  mode: host
              networks:
                application:
                  aliases: [frontend]
              deploy:
                replicas: 2
                placement:
                  constraints: [node.labels.tier == web]
                  max_replicas_per_node: 1
                resources:
                  limits:
                    memory: 128M
                restart_policy:
                  condition: any
                  delay: 10s
          networks:
            application:
              driver: overlay
              attachable: true
          secrets:
            database_password:
              external: true
              name: codetracker-db-password
            rabbitmq_password:
              external: true
              name: codetracker-rabbitmq-password
            jwt_secret:
              external: true
              name: codetracker-jwt-secret
          STACK

          cat > /usr/local/sbin/label-swarm-workers <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          signal_manager_failure() {
            local exit_status="$?"
            trap - EXIT
            if (( exit_status != 0 )); then
              echo "Falha na configuracao ou validacao da aplicacao no Swarm." >&2
              if ! aws cloudformation signal-resource \
                --region '${AWS::Region}' \
                --stack-name '${AWS::StackId}' \
                --logical-resource-id SwarmManagerInstance \
                --unique-id swarm-manager-az1 \
                --status FAILURE; then
                echo "Nao foi possivel sinalizar a falha do SwarmManagerInstance ao CloudFormation." >&2
              fi
            fi
            exit "$exit_status"
          }
          trap signal_manager_failure EXIT

          WORKERS_READY=false
          for attempt in $(seq 1 60); do
            ALL_WORKERS_READY=true

            while read -r NODE_NAME TIER ZONE; do
              NODE_ID=$(docker node ls --filter "name=$NODE_NAME" --format '{{.ID}} {{.Status}}' | awk '$2 == "Ready" && !found { print $1; found = 1 }')

              if [ -z "$NODE_ID" ]; then
                ALL_WORKERS_READY=false
                continue
              fi

              docker node update \
                --label-add "tier=$TIER" \
                --label-add "zone=$ZONE" \
                "$NODE_ID"
            done <<'NODES'
          web-az1 web az1
          web-az2 web az2
          backend-az1 backend az1
          backend-az2 backend az2
          NODES

            if [ "$ALL_WORKERS_READY" = true ]; then
              WORKERS_READY=true
              break
            fi
            sleep 10
          done

          if [ "$WORKERS_READY" != true ]; then
            echo "Os quatro workers nao ficaram prontos no Swarm apos 10 minutos." >&2
            docker node ls >&2
            exit 1
          fi

          DATABASE_READY=false
          for attempt in $(seq 1 90); do
            DATABASE_STACK=$(aws ssm get-parameter \
              --region '${AWS::Region}' \
              --name '/${EnvironmentName}/database/ready' \
              --query Parameter.Value --output text 2>/dev/null || true)
            STANDBY_STACK=$(aws ssm get-parameter \
              --region '${AWS::Region}' \
              --name '/${EnvironmentName}/database/standby-ready' \
              --query Parameter.Value --output text 2>/dev/null || true)
            if [ "$DATABASE_STACK" = '${AWS::StackId}' ] && [ "$STANDBY_STACK" = '${AWS::StackId}' ]; then
              DATABASE_READY=true
              break
            fi
            sleep 10
          done
          if [ "$DATABASE_READY" != true ]; then
            echo "A importacao do banco ou a primeira copia na AZ1 nao foi concluida." >&2
            exit 1
          fi

          docker stack deploy --compose-file /opt/codetracker/stack.yml codetracker

          for attempt in $(seq 1 90); do
            READY_SERVICES=$(docker service ls --filter label=com.docker.stack.namespace=codetracker \
              --format '{{.Name}} {{.Replicas}}' | awk '
                $1 == "codetracker_backend" && $2 == "4/4" { ready++ }
                $1 == "codetracker_frontend" && $2 == "2/2" { ready++ }
                $1 == "codetracker_etiquetas" && $2 == "1/1" { ready++ }
                END { print ready + 0 }
              ')

            if [ "$READY_SERVICES" = 3 ]; then
              if curl --fail --silent --show-error --max-time 15 \
                'http://${ApplicationLoadBalancer.DNSName}/' > /dev/null; then
                BACKEND_STATUS=$(curl \
                  --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
                  'http://${ApplicationLoadBalancer.DNSName}/api/' || true)
                ETIQUETAS_STATUS=$(curl \
                  --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
                  'http://${ApplicationLoadBalancer.DNSName}/etiquetas-api/' || true)

                if [[ "$BACKEND_STATUS" =~ ^[234][0-9][0-9]$ ]] && \
                   [[ "$ETIQUETAS_STATUS" =~ ^[234][0-9][0-9]$ ]]; then
                  aws cloudformation signal-resource \
                    --region '${AWS::Region}' \
                    --stack-name '${AWS::StackId}' \
                    --logical-resource-id SwarmManagerInstance \
                    --unique-id swarm-manager-az1 \
                    --status SUCCESS
                  trap - EXIT
                  exit 0
                fi
              fi
            fi

            sleep 10
          done

          docker service ls
          exit 1
          SCRIPT

          chmod 750 /usr/local/sbin/label-swarm-workers

          cat > /etc/systemd/system/label-swarm-workers.service <<'SERVICE'
          [Unit]
          Description=Configura workers e publica a aplicacao no Docker Swarm
          After=docker.service
          Requires=docker.service
          StartLimitIntervalSec=0

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/label-swarm-workers
          RemainAfterExit=yes
          Restart=on-failure
          RestartSec=15

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable label-swarm-workers.service
          systemctl start --no-block label-swarm-workers.service
        - BootstrapScript: !FindInMap [Bootstrap, Common, Script]

  BackendInstanceAz1:
    Type: AWS::EC2::Instance
    DependsOn:
      - BackendSubnetAz1RouteTableAssociation
      - PrivateDefaultRouteAz1
      - SwarmManagementIngress
      - SwarmDiscoveryTcpIngress
      - SwarmDiscoveryUdpIngress
      - SwarmOverlayIngress
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref BackendSecurityGroup
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref BackendSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-backend-az1'
      UserData:
        Fn::Base64: !Sub
        - |
          #!/bin/bash
          BOOTSTRAP_RESOURCE=BackendInstanceAz1
          BOOTSTRAP_SIGNAL_URL='${BootstrapSignalHandle}'
          ${BootstrapScript}

          install_packages ca-certificates curl unzip python3 docker.io openssh-server
          install_aws_cli

          hostnamectl set-hostname backend-az1
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            for attempt in $(seq 1 90); do
              if MANAGER_STACK=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/stack-id' \
                --query Parameter.Value \
                --output text 2>/dev/null) && [ "$MANAGER_STACK" = '${AWS::StackId}' ] && WORKER_TOKEN=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/worker-token' \
                --with-decryption \
                --query Parameter.Value \
                --output text 2>/dev/null) && MANAGER_IP=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/manager-ip' \
                --query Parameter.Value \
                --output text 2>/dev/null); then
                if docker swarm join \
                  --token "$WORKER_TOKEN" \
                  "$MANAGER_IP:2377"; then
                  break
                fi
              fi

              sleep 10
            done
          fi

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "Nao foi possivel adicionar backend-az1 ao Docker Swarm." >&2
            exit 1
          fi

        - BootstrapScript: !FindInMap [Bootstrap, Common, Script]

