  DatabaseDataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt BackendSubnetAz2.AvailabilityZone
      Size: 20
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-volume-dados-banco-az2'

  DatabaseInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - BackendSubnetAz2RouteTableAssociation
      - PrivateDefaultRouteAz2
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref DatabaseSecurityGroup
            - !Ref PrivateSshSecurityGroup
          SubnetId: !Ref BackendSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-banco-az2'
      UserData:
        Fn::Base64: !Sub
        - |
          #!/bin/bash
          BOOTSTRAP_RESOURCE=DatabaseInstance
          BOOTSTRAP_SIGNAL_URL='${BootstrapSignalHandle}'
          ${BootstrapScript}


          EBS_VOLUME_ID=$(printf '%s' '${DatabaseDataVolume}' | tr -d '-')
          DEVICE=""

          for attempt in $(seq 1 60); do
            for candidate in "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$EBS_VOLUME_ID" /dev/xvdf /dev/sdf; do
              if [ -b "$candidate" ]; then
                DEVICE="$candidate"
                break 2
              fi
            done
            sleep 5
          done

          if [ -z "$DEVICE" ]; then
            echo "O volume EBS nao foi encontrado apos 300 segundos." >&2
            exit 1
          fi

          if ! blkid "$DEVICE" >/dev/null 2>&1; then
            mkfs.ext4 "$DEVICE"
          fi

          EBS_UUID=$(blkid -s UUID -o value "$DEVICE")
          mkdir -p /var/lib/mysql

          if ! grep -q "UUID=$EBS_UUID /var/lib/mysql " /etc/fstab; then
            echo "UUID=$EBS_UUID /var/lib/mysql ext4 defaults,nofail 0 2" >> /etc/fstab
          fi

          mountpoint -q /var/lib/mysql || mount /var/lib/mysql
          rmdir /var/lib/mysql/lost+found 2>/dev/null || true

          install_packages mysql-server git apache2-utils ca-certificates curl unzip
          install_aws_cli
          systemctl enable --now mysql

          cat > /etc/mysql/mysql.conf.d/zz-lamar-network.cnf <<'MYSQL_CONFIG'
          [mysqld]
          bind-address = 0.0.0.0
          mysqlx-bind-address = 127.0.0.1
          MYSQL_CONFIG

          systemctl restart mysql
          if [ "$(mysql --batch --skip-column-names --execute 'SELECT @@global.bind_address;')" != '0.0.0.0' ]; then
            echo "MySQL nao esta escutando na rede privada." >&2
            exit 1
          fi

          if [ ! -f /var/lib/mysql/.lamar-import-complete ]; then
            TABLE_COUNT=$(mysql --batch --skip-column-names --execute \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '${DatabaseName}';")
            if [ "$TABLE_COUNT" != 0 ]; then
              echo "Banco existente sem marcador de importacao. Abortando para preservar os dados." >&2
              exit 1
            fi

            BOOTSTRAP_STAGE=database-import
            CLONE_COMPLETE=false
            for attempt in $(seq 1 3); do
              CLONE_DIR=$(mktemp -d /opt/banco-clone.XXXXXX)
              if timeout --signal=TERM --kill-after=5s 120 \
                git clone --depth 1 https://github.com/EnzoServilha/Banco_Grupo7.git "$CLONE_DIR/repo"; then
                mv "$CLONE_DIR/repo" /opt/Banco_Grupo7
                rmdir "$CLONE_DIR"
                CLONE_COMPLETE=true
                break
              fi
              echo "Falha ao clonar o SQL (tentativa $attempt de 3)." >&2
              rm -rf -- "$CLONE_DIR"
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            if [ "$CLONE_COMPLETE" != true ]; then
              echo "Nao foi possivel baixar o SQL do GitHub." >&2
              exit 1
            fi
            mysql --default-character-set=utf8mb4 < /opt/Banco_Grupo7/SCRIPT-Lamar-AutoPecas.sql
            git -C /opt/Banco_Grupo7 rev-parse HEAD > /var/lib/mysql/.lamar-import-complete
            BOOTSTRAP_STAGE=configuration
          fi

          mysql <<'SQL'
          CREATE DATABASE IF NOT EXISTS `${DatabaseName}`;
          CREATE USER IF NOT EXISTS '${DatabaseUser}'@'10.0.0.%' IDENTIFIED BY '${DatabasePassword}';
          ALTER USER '${DatabaseUser}'@'10.0.0.%' IDENTIFIED BY '${DatabasePassword}';
          GRANT ALL PRIVILEGES ON `${DatabaseName}`.* TO '${DatabaseUser}'@'10.0.0.%';
          CREATE USER IF NOT EXISTS 'codetracker_backup'@'10.0.0.%' IDENTIFIED BY '${DatabasePassword}';
          ALTER USER 'codetracker_backup'@'10.0.0.%' IDENTIFIED BY '${DatabasePassword}';
          GRANT SELECT, SHOW VIEW, TRIGGER, EVENT ON `${DatabaseName}`.* TO 'codetracker_backup'@'10.0.0.%';
          GRANT SHOW_ROUTINE ON *.* TO 'codetracker_backup'@'10.0.0.%';
          FLUSH PRIVILEGES;
          SQL

          BOOTSTRAP_STAGE=admin-account
          ADMIN_RECORD=$(printf '%s\n' '${AdminPassword}' | htpasswd -niB -C 10 admin)
          ADMIN_HASH=$(printf '%s' "$ADMIN_RECORD" | cut -d: -f2-)
          if [ "$ADMIN_HASH" = "$ADMIN_RECORD" ] || [ -z "$ADMIN_HASH" ]; then
            echo "Nao foi possivel gerar o hash BCrypt do administrador." >&2
            exit 1
          fi
          unset ADMIN_RECORD
          UPDATED_ADMIN=$(mysql --database='${DatabaseName}' --batch --skip-column-names <<SQL
          UPDATE usuario SET senha = '$ADMIN_HASH'
          WHERE email = 'admin@teste.com' AND ativo = 1
            AND permissao_id = (SELECT id FROM permissao WHERE nome = 'ROLE_ADMIN');
          SELECT ROW_COUNT();
          SQL
          )
          unset ADMIN_HASH
          if [ "$UPDATED_ADMIN" != 1 ]; then
            echo "Administrador ativo admin@teste.com com ROLE_ADMIN nao encontrado no banco importado." >&2
            exit 1
          fi
          BOOTSTRAP_STAGE=configuration

          aws ssm put-parameter \
            --region '${AWS::Region}' \
            --name '/${EnvironmentName}/database/ready' \
            --type String \
            --value '${AWS::StackId}' \
            --overwrite

        - BootstrapScript: !FindInMap [Bootstrap, Common, Script]

  DatabaseDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref DatabaseInstance
      VolumeId: !Ref DatabaseDataVolume

  DatabaseStandbyDataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt BackendSubnetAz1.AvailabilityZone
      Size: 20
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-volume-dados-banco-az1'

  DatabaseStandbyInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - BackendSubnetAz1RouteTableAssociation
      - PrivateDefaultRouteAz1
      - DatabaseBackupIngress
    Metadata:
      RecoveryAgent: |
        #!/usr/bin/env python3
        import fcntl
        import json
        import logging
        import os
        from pathlib import Path
        import subprocess
        import sys
        import time

        class Recovery:
            def __init__(self, config):
                self.config = config
                self.state = Path(config["state_dir"])
                self.state.mkdir(mode=0o700, parents=True, exist_ok=True)
                self.latest = self.state / "latest.sql"
                self.prepared = self.state / "promotion-prepared"
                self.promoted = self.state / "promoted"

            def run(self, args, *, stdin=None, stdout=subprocess.PIPE, timeout=30):
                result = subprocess.run(
                    args, stdin=stdin, stdout=stdout, stderr=subprocess.PIPE, timeout=timeout
                )
                if result.returncode:
                    raise RuntimeError(
                        f"{args[0]} falhou: {result.stderr.decode(errors='replace').strip()}"
                    )
                return result.stdout

            def aws(self, *args):
                output = self.run([
                    "aws", "--region", self.config["region"], "--output", "json",
                    "--cli-connect-timeout", "5", "--cli-read-timeout", "20", *args
                ], timeout=45)
                return json.loads(output)

            def local(self, sql):
                return self.run([
                    "mysql", "--protocol=socket", "--user=root", "--batch",
                    "--skip-column-names", "--execute", sql
                ]).decode().strip()

            def write_state(self, path, value, mode=0o600):
                temporary = path.with_suffix(".tmp")
                with temporary.open("w") as output:
                    os.fchmod(output.fileno(), mode)
                    output.write(value)
                    output.flush()
                    os.fsync(output.fileno())
                temporary.replace(path)
                descriptor = os.open(path.parent, os.O_RDONLY | os.O_DIRECTORY)
                try:
                    os.fsync(descriptor)
                finally:
                    os.close(descriptor)

            def validate(self):
                database = self.config["database"]
                count = self.local(
                    "SELECT COUNT(*) FROM information_schema.tables "
                    f"WHERE table_schema = '{database}';"
                )
                if int(count) == 0:
                    raise RuntimeError("Copia sem tabelas; promocao bloqueada.")
                self.local(f"SELECT COUNT(*) FROM `{database}`.usuario;")

            def restore(self, snapshot):
                try:
                    self.local("SET GLOBAL super_read_only=OFF; SET GLOBAL read_only=OFF;")
                    with snapshot.open("rb") as source:
                        self.run([
                            "mysql", "--protocol=socket", "--user=root",
                            "--default-character-set=utf8mb4"
                        ], stdin=source, timeout=1800)
                    self.validate()
                finally:
                    self.local("SET GLOBAL read_only=ON; SET GLOBAL super_read_only=ON;")

            def backup(self):
                if self.prepared.exists() or self.promoted.exists():
                    logging.info("AZ1 promovida; copia do antigo primario desativada.")
                    return
                started = time.time()
                temporary = self.state / "next.sql"
                with temporary.open("wb") as output:
                    self.run([
                        "mysqldump", "--defaults-extra-file=/etc/codetracker/primary.cnf",
                        "--single-transaction", "--quick", "--skip-lock-tables",
                        "--no-tablespaces", "--set-gtid-purged=OFF", "--routines",
                        "--events", "--triggers", "--add-drop-database",
                        "--databases", self.config["database"]
                    ], stdout=output, timeout=1800)
                    output.flush()
                    os.fsync(output.fileno())
                if temporary.stat().st_size == 0:
                    raise RuntimeError("Dump vazio; a ultima copia valida foi preservada.")
                self.restore(temporary)
                os.utime(temporary, (started, started))
                # Link keeps the last valid snapshot available during an atomic replacement.
                if self.latest.exists():
                    previous = self.state / "previous.sql"
                    previous.unlink(missing_ok=True)
                    os.link(self.latest, previous)
                temporary.replace(self.latest)
                self.write_state(self.state / "last-backup", str(int(started)))
                logging.info("Dump e restauracao AZ1 concluidos; snapshot iniciado em %s.", started)

            def primary_healthy(self):
                try:
                    output = self.run([
                        "mysql", "--defaults-extra-file=/etc/codetracker/primary.cnf",
                        "--batch", "--skip-column-names", "--execute",
                        f"SELECT 1 FROM `{self.config['database']}`.usuario LIMIT 1;"
                    ], timeout=10)
                    return output.strip() == b"1"
                except (RuntimeError, subprocess.TimeoutExpired) as error:
                    logging.error("MySQL AZ2 indisponivel: %s", error)
                    return False

            def primary_state(self):
                result = self.aws(
                    "ec2", "describe-instances", "--instance-ids", self.config["primary_id"]
                )
                return result["Reservations"][0]["Instances"][0]["State"]["Name"]

            def fence(self):
                state = self.primary_state()
                if state in ("stopped", "terminated"):
                    return
                if state not in ("stopping", "shutting-down"):
                    self.aws("ec2", "stop-instances", "--instance-ids", self.config["primary_id"])
                for attempt in range(30):
                    if self.primary_state() in ("stopped", "terminated"):
                        logging.warning("Instancia AZ2 isolada; promocao autorizada.")
                        return
                    time.sleep(10)
                raise RuntimeError("AWS nao confirmou o desligamento da AZ2; failover bloqueado.")

            def publish(self):
                batch = {
                    "Changes": [{
                        "Action": "UPSERT",
                        "ResourceRecordSet": {
                            "Name": self.config["endpoint"], "Type": "A", "TTL": 10,
                            "ResourceRecords": [{"Value": self.config["standby_ip"]}]
                        }
                    }]
                }
                response = self.aws(
                    "route53", "change-resource-record-sets",
                    "--hosted-zone-id", self.config["zone_id"],
                    "--change-batch", json.dumps(batch)
                )
                change_id = response["ChangeInfo"]["Id"]
                for attempt in range(30):
                    if self.aws("route53", "get-change", "--id", change_id)["ChangeInfo"]["Status"] == "INSYNC":
                        return
                    time.sleep(5)
                raise RuntimeError("Alteracao DNS pendente; o monitor tentara novamente.")

            def promote(self):
                self.local("SELECT 1;")
                if not self.latest.exists():
                    raise RuntimeError("Nenhum dump completo disponivel; failover bloqueado.")
                self.fence()
                if not self.prepared.exists():
                    age = max(0, int(time.time() - self.latest.stat().st_mtime))
                    logging.warning("Promovendo AZ1 com snapshot de %s segundos.", age)
                    self.restore(self.latest)
                    # After this marker no retry may restore old data over new writes.
                    self.write_state(self.prepared, str(int(time.time())))
                role_config = Path(self.config["role_config"])
                self.write_state(
                    role_config, "[mysqld]\nread_only=OFF\nsuper_read_only=OFF\n", mode=0o644
                )
                self.local("SET GLOBAL super_read_only=OFF; SET GLOBAL read_only=OFF;")
                self.publish()
                self.write_state(self.promoted, str(int(time.time())))
                logging.warning("Failover concluido: endpoint MySQL aponta para AZ1.")

            def check(self):
                if self.promoted.exists():
                    self.local("SELECT 1;")
                    return
                if self.prepared.exists():
                    self.promote()
                    return
                failures_path = self.state / "failures"
                if self.primary_healthy():
                    self.write_state(failures_path, "0")
                    return
                failures = int(failures_path.read_text()) if failures_path.exists() else 0
                failures += 1
                self.write_state(failures_path, str(failures))
                logging.warning("Falha consecutiva do primario: %s/3.", failures)
                if failures >= 3:
                    self.promote()

        def main():
            os.umask(0o077)
            logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
            with open("/etc/codetracker/recovery.json") as source:
                recovery = Recovery(json.load(source))
            with (recovery.state / "recovery.lock").open("a") as lock:
                try:
                    fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                except BlockingIOError:
                    logging.info("Outra operacao de recuperacao esta em andamento.")
                    return
                if sys.argv[1:] == ["backup"]:
                    recovery.backup()
                elif sys.argv[1:] == ["check"]:
                    recovery.check()
                else:
                    raise ValueError("Use backup ou check.")

        if __name__ == "__main__":
            try:
                main()
            except (OSError, ValueError, KeyError, RuntimeError, subprocess.TimeoutExpired):
                logging.exception("Operacao de recuperacao falhou.")
                sys.exit(1)
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref DatabaseSecurityGroup
            - !Ref PrivateSshSecurityGroup
          SubnetId: !Ref BackendSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-banco-standby-az1'
      UserData:
        Fn::Base64: !Sub
        - |
          #!/bin/bash
          BOOTSTRAP_RESOURCE=DatabaseStandbyInstance
          BOOTSTRAP_SIGNAL_URL='${BootstrapSignalHandle}'
          ${BootstrapScript}

          EBS_VOLUME_ID=$(printf '%s' '${DatabaseStandbyDataVolume}' | tr -d '-')
          DEVICE=""
          for attempt in $(seq 1 60); do
            for candidate in "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$EBS_VOLUME_ID" /dev/xvdf /dev/sdf; do
              if [ -b "$candidate" ]; then
                DEVICE="$candidate"
                break 2
              fi
            done
            sleep 5
          done
          if [ -z "$DEVICE" ]; then
            echo "Volume EBS da copia AZ1 nao encontrado." >&2
            exit 1
          fi
          if ! blkid "$DEVICE" >/dev/null 2>&1; then
            mkfs.ext4 "$DEVICE"
          fi
          EBS_UUID=$(blkid -s UUID -o value "$DEVICE")
          mkdir -p /var/lib/mysql
          if ! grep -q "UUID=$EBS_UUID /var/lib/mysql " /etc/fstab; then
            echo "UUID=$EBS_UUID /var/lib/mysql ext4 defaults,nofail 0 2" >> /etc/fstab
          fi
          mountpoint -q /var/lib/mysql || mount /var/lib/mysql
          rmdir /var/lib/mysql/lost+found 2>/dev/null || true

          install_packages mysql-server python3 ca-certificates curl unzip openssh-server
          install_aws_cli
          hostnamectl set-hostname database-standby-az1
          systemctl enable --now mysql ssh
          umask 077
          mkdir -p /etc/codetracker /var/lib/mysql/.codetracker-recovery
          chmod 700 /var/lib/mysql/.codetracker-recovery
          cat > /etc/mysql/mysql.conf.d/zz-lamar-network.cnf <<'MYSQL_CONFIG'
          [mysqld]
          bind-address = 0.0.0.0
          mysqlx-bind-address = 127.0.0.1
          event_scheduler = OFF
          MYSQL_CONFIG
          cat > /etc/mysql/mysql.conf.d/zz-standby-role.cnf <<'MYSQL_ROLE'
          [mysqld]
          read_only = ON
          super_read_only = ON
          MYSQL_ROLE
          chmod 644 /etc/mysql/mysql.conf.d/zz-lamar-network.cnf /etc/mysql/mysql.conf.d/zz-standby-role.cnf
          systemctl restart mysql
          if [ "$(mysql --batch --skip-column-names --execute 'SELECT @@global.bind_address;')" != '0.0.0.0' ]; then
            echo "MySQL AZ1 nao esta escutando na rede privada." >&2
            exit 1
          fi
          mysql <<'SQL'
          SET GLOBAL super_read_only=OFF;
          SET GLOBAL read_only=OFF;
          CREATE USER IF NOT EXISTS '${DatabaseUser}'@'10.0.0.%' IDENTIFIED BY '${DatabasePassword}';
          ALTER USER '${DatabaseUser}'@'10.0.0.%' IDENTIFIED BY '${DatabasePassword}';
          GRANT ALL PRIVILEGES ON `${DatabaseName}`.* TO '${DatabaseUser}'@'10.0.0.%';
          SET GLOBAL read_only=ON;
          SET GLOBAL super_read_only=ON;
          SQL

          cat > /etc/codetracker/primary.cnf <<'CLIENT'
          [client]
          host=${DatabaseInstance.PrivateIp}
          user=codetracker_backup
          password="${DatabasePassword}"
          connect-timeout=5
          CLIENT
          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          PRIVATE_IP=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/meta-data/local-ipv4)
          cat > /etc/codetracker/recovery.json <<CONFIG
          {
            "region": "${AWS::Region}",
            "primary_id": "${DatabaseInstance}",
            "standby_ip": "$PRIVATE_IP",
            "zone_id": "${DatabasePrivateHostedZone}",
            "endpoint": "${DatabaseEndpointRecord}",
            "database": "${DatabaseName}",
            "state_dir": "/var/lib/mysql/.codetracker-recovery",
            "role_config": "/etc/mysql/mysql.conf.d/zz-standby-role.cnf"
          }
          CONFIG
          aws cloudformation describe-stack-resource \
            --region '${AWS::Region}' --stack-name '${AWS::StackId}' \
            --logical-resource-id DatabaseStandbyInstance \
            --query StackResourceDetail.Metadata --output text \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["RecoveryAgent"], end="")' \
            > /usr/local/sbin/codetracker-database-recovery
          chmod 700 /usr/local/sbin/codetracker-database-recovery

          DATABASE_READY=false
          for attempt in $(seq 1 90); do
            DATABASE_STACK=$(aws ssm get-parameter \
              --region '${AWS::Region}' --name '/${EnvironmentName}/database/ready' \
              --query Parameter.Value --output text 2>/dev/null || true)
            if [ "$DATABASE_STACK" = '${AWS::StackId}' ]; then
              DATABASE_READY=true
              break
            fi
            sleep 10
          done
          if [ "$DATABASE_READY" != true ]; then
            echo "Primario nao concluiu o bootstrap; nenhuma copia foi criada." >&2
            exit 1
          fi
          BOOTSTRAP_STAGE=initial-database-backup
          /usr/local/sbin/codetracker-database-recovery backup

          cat > /etc/systemd/system/codetracker-database-backup.service <<'SERVICE'
          [Unit]
          Description=Copia automatica do MySQL AZ2 para AZ1
          After=network-online.target mysql.service
          Requires=mysql.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/codetracker-database-recovery backup
          TimeoutStartSec=65min
          SERVICE
          cat > /etc/systemd/system/codetracker-database-backup.timer <<'TIMER'
          [Unit]
          Description=Dump MySQL a cada 12 horas
          [Timer]
          OnCalendar=*-*-* 00,12:00:00 UTC
          Persistent=true
          [Install]
          WantedBy=timers.target
          TIMER
          cat > /etc/systemd/system/codetracker-database-failover.service <<'SERVICE'
          [Unit]
          Description=Verifica MySQL AZ2 e promove AZ1 com isolamento do primario
          After=network-online.target mysql.service
          Requires=mysql.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/codetracker-database-recovery check
          TimeoutStartSec=45min
          SERVICE
          cat > /etc/systemd/system/codetracker-database-failover.timer <<'TIMER'
          [Unit]
          Description=Monitor automatico do banco a cada 30 segundos
          [Timer]
          OnBootSec=30s
          OnUnitInactiveSec=30s
          AccuracySec=1s
          [Install]
          WantedBy=timers.target
          TIMER
          systemctl daemon-reload
          systemctl enable --now codetracker-database-backup.timer codetracker-database-failover.timer
          aws ssm put-parameter \
            --region '${AWS::Region}' --name '/${EnvironmentName}/database/standby-ready' \
            --type String --value '${AWS::StackId}' --overwrite
          BOOTSTRAP_STAGE=configuration
        - BootstrapScript: !FindInMap [Bootstrap, Common, Script]

  DatabaseStandbyDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref DatabaseStandbyInstance
      VolumeId: !Ref DatabaseStandbyDataVolume

  WebInstanceAz1:
    Type: AWS::EC2::Instance
    DependsOn:
      - WebSubnetAz1RouteTableAssociation
      - PrivateDefaultRouteAz1
      - SwarmManagementIngress
      - SwarmDiscoveryTcpIngress
      - SwarmDiscoveryUdpIngress
      - SwarmOverlayIngress
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref WebSecurityGroup
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref WebSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-web-az1'
      UserData:
        Fn::Base64: !Sub
        - |
          #!/bin/bash
          BOOTSTRAP_RESOURCE=WebInstanceAz1
          BOOTSTRAP_SIGNAL_URL='${BootstrapSignalHandle}'
          ${BootstrapScript}

          install_packages ca-certificates curl unzip python3 docker.io openssh-server
          install_aws_cli

          hostnamectl set-hostname web-az1
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            for attempt in $(seq 1 90); do
              if MANAGER_STACK=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/stack-id' \
                --query Parameter.Value \
                --output text 2>/dev/null) && [ "$MANAGER_STACK" = '${AWS::StackId}' ] && WORKER_TOKEN=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/worker-token' \
                --with-decryption \
                --query Parameter.Value \
                --output text 2>/dev/null) && MANAGER_IP=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/manager-ip' \
                --query Parameter.Value \
                --output text 2>/dev/null); then
                if docker swarm join \
                  --token "$WORKER_TOKEN" \
                  "$MANAGER_IP:2377"; then
                  break
                fi
              fi

              sleep 10
            done
          fi

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "Nao foi possivel adicionar web-az1 ao Docker Swarm." >&2
            exit 1
          fi

        - BootstrapScript: !FindInMap [Bootstrap, Common, Script]

