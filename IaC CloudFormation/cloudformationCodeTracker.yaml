            exit 1
          fi

        - BootstrapScript: !FindInMap [Bootstrap, Common, Script]

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn:
      - InternetGatewayAttachment
      - PublicDefaultRoute
      - PublicSubnetAz1RouteTableAssociation
      - PublicSubnetAz2RouteTableAssociation
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetAz1
        - !Ref PublicSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb'

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-web-tg'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref Vpc
      HealthCheckPath: /
      Targets:
        - Id: !Ref WebInstanceAz1
          Port: 80
        - Id: !Ref WebInstanceAz2
          Port: 80
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-grupo-destino-web'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

Outputs:
  BackupGpgSecretArn:
    Condition: BackupArchiveEnabled
    Description: Custodia GPG (privada e senha); excluida junto com a stack.
    Value: !Ref BackupGpgSecret

  BackupPublicKeyS3Uri:
    Condition: BackupArchiveEnabled
    Description: Chave publica gerada automaticamente; fingerprint em keys/fingerprint.txt.
    Value: !Sub 's3://${BackupArchiveBucket}/keys/grupo7-publica.asc'

  BackupArchiveBucketName:
    Condition: BackupArchiveEnabled
    Description: Bucket privado de backups e logs; esvaziado e excluido junto com a stack.
    Value: !Ref BackupArchiveBucket

  BackupArchiveS3Uri:
    Condition: BackupArchiveEnabled
    Description: Prefixo dos pacotes GPG; custodia privada no segredo identificado por BackupGpgSecretArn.
    Value: !Sub 's3://${BackupArchiveBucket}/backups/'

  ApplicationUrl:
    Description: URL HTTP publica do Application Load Balancer.
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  BastionPublicIp:
    Description: Endereco IP publico fixo do bastion para acesso SSH.
    Value: !Ref BastionEip

  SwarmManagerPrivateIp:
    Description: Endereco IP privado do manager Docker Swarm.
    Value: !GetAtt SwarmManagerInstance.PrivateIp

  SwarmManagerSshCommand:
    Description: Comando base para acessar o manager pelo bastion.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${SwarmManagerInstance.PrivateIp}'

  SwarmManagerSftpCommand:
    Description: Comando base para enviar arquivos ao manager pelo bastion.
    Value: !Sub 'sftp -i <chave.pem> -o ProxyJump=ubuntu@${BastionEip} ubuntu@${SwarmManagerInstance.PrivateIp}'


  DatabasePrivateIp:
    Description: IP do banco original AZ2; nao acompanha o failover. Use DatabaseEndpoint.
    Value: !GetAtt DatabaseInstance.PrivateIp

  DatabaseEndpoint:
    Description: Nome DNS privado usado pelo backend; muda para AZ1 apos failover automatico.
    Value: !Ref DatabaseEndpointRecord

  DatabaseJdbcUrl:
    Description: URL JDBC privada utilizada pelo backend.
    Value: !Sub 'jdbc:mysql://${DatabaseEndpointRecord}:3306/${DatabaseName}'

  DatabaseStandbyPrivateIp:
    Description: IP privado do MySQL de recuperacao na AZ1.
    Value: !GetAtt DatabaseStandbyInstance.PrivateIp

  DatabaseStandbySshCommand:
    Description: Acesso ao banco de recuperacao e seus logs de dump e failover.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${DatabaseStandbyInstance.PrivateIp}'

  RabbitMqPrivateIp:
    Description: IP do backend AZ1 que tambem hospeda RabbitMQ e etiquetas.
    Value: !GetAtt BackendInstanceAz1.PrivateIp

  RabbitMqAmqpEndpoint:
    Description: Broker independente AZ1; filas nao sao replicadas para AZ2.
    Value: !Sub 'amqp://${BackendInstanceAz1.PrivateIp}:5672'

  RabbitMqSshCommand:
    Description: Acesso ao backend AZ1 e seu broker RabbitMQ pelo bastion.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${BackendInstanceAz1.PrivateIp}'

  RabbitMqManagementTunnelCommand:
    Description: Tunel SSH para acessar a interface RabbitMQ em http://localhost:15672.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} -L 15672:localhost:15672 ubuntu@${BackendInstanceAz1.PrivateIp}'

  RabbitMqAz2PrivateIp:
    Description: IP do backend AZ2 que tambem hospeda RabbitMQ e etiquetas.
    Value: !GetAtt BackendInstanceAz2.PrivateIp

  RabbitMqAddresses:
    Description: Lista de brokers enviada ao Spring AMQP; nao replica filas ou mensagens.
    Value: !Sub '${BackendInstanceAz1.PrivateIp}:5672,${BackendInstanceAz2.PrivateIp}:5672'

  RabbitMqAz2SshCommand:
    Description: Acesso ao backend AZ2 e seu broker RabbitMQ pelo bastion.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${BackendInstanceAz2.PrivateIp}'

  RabbitMqAz2ManagementTunnelCommand:
    Description: Tunel local 15673 para o painel do broker AZ2.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} -L 15673:localhost:15672 ubuntu@${BackendInstanceAz2.PrivateIp}'
