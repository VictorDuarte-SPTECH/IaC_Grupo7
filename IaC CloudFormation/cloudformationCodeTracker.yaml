  DatabaseEndpoint:
    Description: Nome DNS privado usado pelo backend; muda para AZ1 apos failover automatico.
    Value: !Ref DatabaseEndpointRecord

  DatabaseJdbcUrl:
    Description: URL JDBC privada utilizada pelo backend.
    Value: !Sub 'jdbc:mysql://${DatabaseEndpointRecord}:3306/${DatabaseName}'

  DatabaseStandbyPrivateIp:
    Description: IP privado do MySQL de recuperacao na AZ1.
    Value: !GetAtt DatabaseStandbyInstance.PrivateIp

  DatabaseStandbySshCommand:
    Description: Acesso ao banco de recuperacao e seus logs de dump e failover.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${DatabaseStandbyInstance.PrivateIp}'

  RabbitMqPrivateIp:
    Description: Endereco IP privado da instancia EC2 do RabbitMQ.
    Value: !GetAtt RabbitMqInstance.PrivateIp

  RabbitMqAmqpEndpoint:
    Description: Broker independente AZ1; filas nao sao replicadas para AZ2.
    Value: !Sub 'amqp://${RabbitMqInstance.PrivateIp}:5672'

  RabbitMqSshCommand:
    Description: Comando base para acessar a VM RabbitMQ pelo bastion.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${RabbitMqInstance.PrivateIp}'

  RabbitMqManagementTunnelCommand:
    Description: Tunel SSH para acessar a interface RabbitMQ em http://localhost:15672.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} -L 15672:localhost:15672 ubuntu@${RabbitMqInstance.PrivateIp}'

  RabbitMqAz2PrivateIp:
    Description: IP privado do segundo broker independente na AZ2.
    Value: !GetAtt RabbitMqInstanceAz2.PrivateIp

  RabbitMqAddresses:
    Description: Lista de brokers enviada ao Spring AMQP; nao replica filas ou mensagens.
    Value: !Sub '${RabbitMqInstance.PrivateIp}:5672,${RabbitMqInstanceAz2.PrivateIp}:5672'

  RabbitMqAz2SshCommand:
    Description: Acesso SSH ao broker independente AZ2 pelo bastion.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${RabbitMqInstanceAz2.PrivateIp}'

  RabbitMqAz2ManagementTunnelCommand:
    Description: Tunel local 15673 para o painel do broker AZ2.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} -L 15673:localhost:15672 ubuntu@${RabbitMqInstanceAz2.PrivateIp}'