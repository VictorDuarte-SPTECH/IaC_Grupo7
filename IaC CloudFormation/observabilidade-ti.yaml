AWSTemplateFormatVersion: '2010-09-09'
Description: Painel operacional e alertas para a equipe de sustentacao.

Parameters:
  EnvironmentName:
    Type: String
    Default: lamar-auto-pecas
  DatabaseInstanceId:
    Type: AWS::EC2::Instance::Id
  DatabaseVolumeId:
    Type: String
    Description: ID do volume EBS do banco de dados da stack principal.
  DatabaseStandbyInstanceId:
    Type: AWS::EC2::Instance::Id
    Description: ID da instancia MySQL standby na AZ1 da stack principal.
  DatabaseStandbyVolumeId:
    Type: String
    Description: ID do volume EBS do MySQL standby na AZ1 da stack principal.
  RabbitMqInstanceId:
    Type: AWS::EC2::Instance::Id
  RabbitMqInstanceAz2Id:
    Type: AWS::EC2::Instance::Id
    Description: ID da instancia RabbitMQ independente na AZ2 da stack principal.
  SwarmManagerInstanceId:
    Type: AWS::EC2::Instance::Id
  WebAz1InstanceId:
    Type: AWS::EC2::Instance::Id
  WebAz2InstanceId:
    Type: AWS::EC2::Instance::Id
  BackendAz1InstanceId:
    Type: AWS::EC2::Instance::Id
  BackendAz2InstanceId:
    Type: AWS::EC2::Instance::Id
  LoadBalancerFullName:
    Type: String
    Description: Parte do ARN apos loadbalancer/ (app/nome/id).
  TargetGroupFullName:
    Type: String
    Description: Parte do ARN apos targetgroup/ (nome/id).
  AlertEmail:
    Type: String
    Default: ''
    Description: Email para alertas; vazio cria apenas o topico SNS.
  BastionInstanceId:
    Type: String
    Default: ''
    Description: ID do bastion; vazio desativa seu monitoramento.
  IpeaIngestionFunctionName:
    Type: String
    Default: ''
    Description: Nome fisico da Lambda compartilhada Ipea/Comex; preencha todos os nomes do data lake.
  UploadFunctionName:
    Type: String
    Default: ''
  GlueStarterFunctionName:
    Type: String
    Default: ''
  ScriptPublisherFunctionName:
    Type: String
    Default: ''
  BucketCleanupFunctionName:
    Type: String
    Default: ''
  GlueJobName:
    Type: String
    Default: ''
  BronzeBucketName:
    Type: String
    Default: ''
  SilverBucketName:
    Type: String
    Default: ''
  GoldBucketName:
    Type: String
    Default: ''
  IpeaMonthlyRuleName:
    Type: String
    Default: ''

Rules:
  CompleteDataLakeConfiguration:
    RuleCondition: !Not [!Equals [!Ref IpeaIngestionFunctionName, '']]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref UploadFunctionName, '']]
          - !Not [!Equals [!Ref GlueStarterFunctionName, '']]
          - !Not [!Equals [!Ref ScriptPublisherFunctionName, '']]
          - !Not [!Equals [!Ref BucketCleanupFunctionName, '']]
          - !Not [!Equals [!Ref GlueJobName, '']]
          - !Not [!Equals [!Ref BronzeBucketName, '']]
          - !Not [!Equals [!Ref SilverBucketName, '']]
          - !Not [!Equals [!Ref GoldBucketName, '']]
          - !Not [!Equals [!Ref IpeaMonthlyRuleName, '']]
        AssertDescription: Preencha todos os nomes do data lake quando informar a Lambda Ipea.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasBastion: !Not [!Equals [!Ref BastionInstanceId, '']]
  HasDataLake: !And
    - !Not [!Equals [!Ref IpeaIngestionFunctionName, '']]
    - !Not [!Equals [!Ref UploadFunctionName, '']]
    - !Not [!Equals [!Ref GlueStarterFunctionName, '']]
    - !Not [!Equals [!Ref ScriptPublisherFunctionName, '']]
    - !Not [!Equals [!Ref BucketCleanupFunctionName, '']]
    - !Not [!Equals [!Ref GlueJobName, '']]
    - !Not [!Equals [!Ref BronzeBucketName, '']]
    - !Not [!Equals [!Ref SilverBucketName, '']]
    - !Not [!Equals [!Ref GoldBucketName, '']]
    - !Not [!Equals [!Ref IpeaMonthlyRuleName, '']]

Resources:
  OperationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${EnvironmentName}-observabilidade-ti'

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref OperationsTopic

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${EnvironmentName}-operacoes'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "CPU por instancia (%)", "region": "${AWS::Region}", "stat": "Average", "period": 300,
                "metrics": [
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${DatabaseInstanceId}", {"label": "MySQL primario AZ2"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${DatabaseStandbyInstanceId}", {"label": "MySQL standby AZ1"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${RabbitMqInstanceId}", {"label": "RabbitMQ AZ1"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${RabbitMqInstanceAz2Id}", {"label": "RabbitMQ independente AZ2"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${SwarmManagerInstanceId}", {"label": "Swarm manager"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${WebAz1InstanceId}", {"label": "Web AZ1"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${WebAz2InstanceId}", {"label": "Web AZ2"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${BackendAz1InstanceId}", {"label": "Backend AZ1"}],
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${BackendAz2InstanceId}", {"label": "Backend AZ2"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Falhas de status EC2", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
                "metrics": [
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${DatabaseInstanceId}", {"label": "MySQL primario AZ2"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${DatabaseStandbyInstanceId}", {"label": "MySQL standby AZ1"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${RabbitMqInstanceId}", {"label": "RabbitMQ AZ1"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${RabbitMqInstanceAz2Id}", {"label": "RabbitMQ independente AZ2"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${SwarmManagerInstanceId}", {"label": "Manager"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${WebAz1InstanceId}", {"label": "Web AZ1"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${WebAz2InstanceId}", {"label": "Web AZ2"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${BackendAz1InstanceId}", {"label": "Backend AZ1"}],
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${BackendAz2InstanceId}", {"label": "Backend AZ2"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Operacoes do volume EBS do MySQL", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/EBS", "VolumeReadOps", "VolumeId", "${DatabaseVolumeId}", {"label": "Leituras primario AZ2"}],
                  ["AWS/EBS", "VolumeWriteOps", "VolumeId", "${DatabaseVolumeId}", {"label": "Gravacoes primario AZ2"}],
                  ["AWS/EBS", "VolumeReadOps", "VolumeId", "${DatabaseStandbyVolumeId}", {"label": "Leituras standby AZ1"}],
                  ["AWS/EBS", "VolumeWriteOps", "VolumeId", "${DatabaseStandbyVolumeId}", {"label": "Gravacoes standby AZ1"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Saude dos targets do ALB", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
                "metrics": [
                  ["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${LoadBalancerFullName}", {"label": "Saudaveis"}],
                  ["AWS/ApplicationELB", "UnHealthyHostCount", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${LoadBalancerFullName}", {"label": "Nao saudaveis"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Erros HTTP dos targets", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
                "metrics": [
                  ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${LoadBalancerFullName}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Latencia dos targets (p95)", "region": "${AWS::Region}", "stat": "p95", "period": 60,
                "metrics": [
                  ["AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${LoadBalancerFullName}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 18, "width": 24, "height": 6,
              "properties": {
                "title": "Creditos CPU das EC2 (T3/T2; sem dados em outros tipos)", "region": "${AWS::Region}", "stat": "Minimum", "period": 300,
                "metrics": [
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${DatabaseInstanceId}", {"label": "MySQL AZ2"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${DatabaseStandbyInstanceId}", {"label": "MySQL AZ1"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${SwarmManagerInstanceId}", {"label": "Manager"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${BackendAz1InstanceId}", {"label": "Backend AZ1"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${BackendAz2InstanceId}", {"label": "Backend AZ2"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${WebAz1InstanceId}", {"label": "Web AZ1"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${WebAz2InstanceId}", {"label": "Web AZ2"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${RabbitMqInstanceId}", {"label": "RabbitMQ AZ1"}],
                  ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${RabbitMqInstanceAz2Id}", {"label": "RabbitMQ AZ2"}]
                ]
              }
            }
          ]
        }

  DatabaseStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-mysql-status-ec2'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref DatabaseInstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref OperationsTopic]

  DatabaseStandbyStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-mysql-standby-status-ec2'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref DatabaseStandbyInstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref OperationsTopic]

  RabbitMqStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-rabbitmq-az1-status-ec2'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref RabbitMqInstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref OperationsTopic]

  RabbitMqAz2StatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-rabbitmq-az2-status-ec2'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref RabbitMqInstanceAz2Id
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref OperationsTopic]

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-web-targets-nao-saudaveis'
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-web-erros-5xx'
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  ApplicationInstancesStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falha de status em manager, web ou backend. Consulte o painel para identificar a EC2.
      Metrics:
        - Id: failures
          Expression: MAX([manager,web1,web2,backend1,backend2])
          ReturnData: true
        - Id: manager
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/EC2, MetricName: StatusCheckFailed, Dimensions: [{Name: InstanceId, Value: !Ref SwarmManagerInstanceId}]}
            Period: 60
            Stat: Maximum
        - Id: web1
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/EC2, MetricName: StatusCheckFailed, Dimensions: [{Name: InstanceId, Value: !Ref WebAz1InstanceId}]}
            Period: 60
            Stat: Maximum
        - Id: web2
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/EC2, MetricName: StatusCheckFailed, Dimensions: [{Name: InstanceId, Value: !Ref WebAz2InstanceId}]}
            Period: 60
            Stat: Maximum
        - Id: backend1
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/EC2, MetricName: StatusCheckFailed, Dimensions: [{Name: InstanceId, Value: !Ref BackendAz1InstanceId}]}
            Period: 60
            Stat: Maximum
        - Id: backend2
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/EC2, MetricName: StatusCheckFailed, Dimensions: [{Name: InstanceId, Value: !Ref BackendAz2InstanceId}]}
            Period: 60
            Stat: Maximum
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]

  BastionStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBastion
    Properties:
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref BastionInstanceId}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]

  NoHealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Nenhum frontend saudavel no ALB ou telemetria ausente.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: TargetGroup, Value: !Ref TargetGroupFullName}
        - {Name: LoadBalancer, Value: !Ref LoadBalancerFullName}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]

  HighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Latencia p95 acima de 2 segundos em 3 de 5 minutos.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - {Name: TargetGroup, Value: !Ref TargetGroupFullName}
        - {Name: LoadBalancer, Value: !Ref LoadBalancerFullName}
      ExtendedStatistic: p95
      EvaluateLowSampleCountPercentile: ignore
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]

  DataLakeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: HasDataLake
    Properties:
      DashboardName: !Sub '${EnvironmentName}-datalake'
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{
              "title":"Erros Lambda (inclui timeout e excecoes)","region":"${AWS::Region}","stat":"Sum","period":300,
              "metrics":[
                ["AWS/Lambda","Errors","FunctionName","${IpeaIngestionFunctionName}",{"label":"Ingestao Ipea/Comex"}],
                ["AWS/Lambda","Errors","FunctionName","${UploadFunctionName}",{"label":"Upload"}],
                ["AWS/Lambda","Errors","FunctionName","${GlueStarterFunctionName}",{"label":"Glue starter"}],
                ["AWS/Lambda","Errors","FunctionName","${ScriptPublisherFunctionName}",{"label":"Publisher"}],
                ["AWS/Lambda","Errors","FunctionName","${BucketCleanupFunctionName}",{"label":"Limpeza"}]
              ]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{
              "title":"Throttles Lambda","region":"${AWS::Region}","stat":"Sum","period":300,
              "metrics":[
                ["AWS/Lambda","Throttles","FunctionName","${IpeaIngestionFunctionName}"],
                ["AWS/Lambda","Throttles","FunctionName","${UploadFunctionName}"],
                ["AWS/Lambda","Throttles","FunctionName","${GlueStarterFunctionName}"],
                ["AWS/Lambda","Throttles","FunctionName","${ScriptPublisherFunctionName}"],
                ["AWS/Lambda","Throttles","FunctionName","${BucketCleanupFunctionName}"]
              ]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{
              "title":"Ipea/Comex: cargas confirmadas, falhas e registros coletados","region":"${AWS::Region}","stat":"Sum","period":86400,
              "metrics":[
                ["CodeTracker/DataLake","IngestionSuccess","FunctionName","${IpeaIngestionFunctionName}","Source","ipeadata",{"label":"Sucesso Ipea"}],
                ["CodeTracker/DataLake","IngestionSuccess","FunctionName","${IpeaIngestionFunctionName}","Source","comexstat",{"label":"Sucesso Comex (quando ativado)"}],
                ["CodeTracker/DataLake","IngestionFailure","FunctionName","${IpeaIngestionFunctionName}"],
                ["CodeTracker/DataLake","RecordsIngested","FunctionName","${IpeaIngestionFunctionName}"]
              ]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{
              "title":"Duracao do coletor Ipea/Comex (ms; inclui Glue)","region":"${AWS::Region}","stat":"Maximum","period":300,
              "metrics":[["AWS/Lambda","Duration","FunctionName","${IpeaIngestionFunctionName}"]]}},
            {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{
              "title":"Tamanho diario dos buckets (bytes; nao e tempo real)","region":"${AWS::Region}","stat":"Average","period":86400,
              "metrics":[
                ["AWS/S3","BucketSizeBytes","BucketName","${BronzeBucketName}","StorageType","StandardStorage"],
                ["AWS/S3","BucketSizeBytes","BucketName","${SilverBucketName}","StorageType","StandardStorage"],
                ["AWS/S3","BucketSizeBytes","BucketName","${GoldBucketName}","StorageType","StandardStorage"]
              ]}},
            {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{
              "title":"Agendamento mensal: invocacoes e falhas de entrega","region":"${AWS::Region}","stat":"Sum","period":3600,
              "metrics":[
                ["AWS/Events","Invocations","RuleName","${IpeaMonthlyRuleName}"],
                ["AWS/Events","FailedInvocations","RuleName","${IpeaMonthlyRuleName}"]
              ]}},
            {"type":"log","x":0,"y":18,"width":24,"height":6,"properties":{
              "title":"Ultimas cargas por fonte (logs; depende da retencao)","region":"${AWS::Region}",
              "query":"SOURCE '/aws/lambda/${IpeaIngestionFunctionName}' | fields @timestamp, Source, IngestionSuccess, IngestionFailure, RecordsIngested, @message | filter ispresent(IngestionSuccess) or ispresent(IngestionFailure) | sort @timestamp desc | limit 30"
            }}
          ]
        }

  IpeaLogicalFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasDataLake
    Properties:
      AlarmDescription: Falha logica da ingestao, inclusive FAILED devolvido ao CloudFormation.
      Namespace: CodeTracker/DataLake
      MetricName: IngestionFailure
      Dimensions: [{Name: FunctionName, Value: !Ref IpeaIngestionFunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  DataLakeLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasDataLake
    Properties:
      AlarmDescription: Erro em uma das cinco Lambdas do data lake; consulte o painel e os logs.
      Metrics:
        - {Id: total, Expression: 'SUM([ipea,upload,starter,publisher,cleanup])', ReturnData: true}
        - Id: ipea
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref IpeaIngestionFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: upload
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref UploadFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: starter
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref GlueStarterFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: publisher
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref ScriptPublisherFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: cleanup
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref BucketCleanupFunctionName}]}
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  IpeaDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasDataLake
    Properties:
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions: [{Name: RuleName, Value: !Ref IpeaMonthlyRuleName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  IpeaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasDataLake
    Properties:
      AlarmDescription: Ingestao levou mais de 12 minutos, proxima ao timeout de 15 minutos.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{Name: FunctionName, Value: !Ref IpeaIngestionFunctionName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 720000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  DataLakeLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasDataLake
    Properties:
      AlarmDescription: Invocacao Lambda limitada por concorrencia; consulte o painel do data lake.
      Metrics:
        - {Id: total, Expression: 'SUM([ipea,upload,starter,publisher,cleanup])', ReturnData: true}
        - Id: ipea
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{Name: FunctionName, Value: !Ref IpeaIngestionFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: upload
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{Name: FunctionName, Value: !Ref UploadFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: starter
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{Name: FunctionName, Value: !Ref GlueStarterFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: publisher
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{Name: FunctionName, Value: !Ref ScriptPublisherFunctionName}]}
            Period: 300
            Stat: Sum
        - Id: cleanup
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{Name: FunctionName, Value: !Ref BucketCleanupFunctionName}]}
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  UploadHttp5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasDataLake
    Properties:
      AlarmDescription: Function URL retornou HTTP 5xx, mesmo sem excecao nao tratada na Lambda.
      Namespace: AWS/Lambda
      MetricName: Url5xxCount
      Dimensions: [{Name: FunctionName, Value: !Ref UploadFunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  GlueFailureTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasDataLake
    Properties:
      Topics: [!Ref OperationsTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref OperationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt GlueFailureRule.Arn

  GlueFailureRule:
    Type: AWS::Events::Rule
    Condition: HasDataLake
    Properties:
      EventPattern:
        source: [aws.glue]
        detail-type: [Glue Job State Change]
        detail:
          jobName: [!Ref GlueJobName]
          state: [FAILED, TIMEOUT, STOPPED]
      Targets:
        - {Arn: !Ref OperationsTopic, Id: NotifyOperations}

Outputs:
  DashboardName:
    Value: !Ref OperationsDashboard
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${OperationsDashboard}'
  AlertTopicArn:
    Value: !Ref OperationsTopic
  DataLakeDashboardUrl:
    Condition: HasDataLake
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DataLakeDashboard}'