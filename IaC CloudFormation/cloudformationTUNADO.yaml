AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Infraestrutura principal da Lamar Auto Pecas: VPC em duas zonas de
  disponibilidade, instancias EC2, volume EBS, Application Load Balancer,
  bastion SSH e manager Docker Swarm, sem recursos de observabilidade.

Parameters:
  EnvironmentName:
    Type: String
    Default: lamar-auto-pecas
    Description: Nome base utilizado nos recursos da aplicacao.
    MinLength: 1
    MaxLength: 25
    AllowedPattern: '[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?'
    ConstraintDescription: Use apenas letras, numeros e hifens, sem hifen no inicio ou no fim.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Tipo das instancias EC2 da aplicacao e do banco.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Nome do par de chaves EC2 usado para acesso SSH e SFTP.

  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Nome do IAM instance profile associado as instancias EC2.
    MinLength: 1

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Parametro SSM que resolve a AMI mais recente do Ubuntu Server 24.04.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/25
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc-principal'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-gateway-internet'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.0/27
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-publica-az1'

  PublicSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.0.32/27
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-publica-az2'

  WebSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.64/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-web-az1'

  WebSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.0.80/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-web-az2'

  BackendSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.96/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-backend-az1'

  BackendSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.0.112/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-backend-az2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tabela-rotas-publica'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAz1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAz1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetAz2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAz2
      RouteTableId: !Ref PublicRouteTable

  NatEipAz1:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ip-elastico-nat-az1'

  NatEipAz2:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ip-elastico-nat-az2'

  NatGatewayAz1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipAz1.AllocationId
      SubnetId: !Ref PublicSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-gateway-nat-az1'

  NatGatewayAz2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipAz2.AllocationId
      SubnetId: !Ref PublicSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-gateway-nat-az2'

  PrivateRouteTableAz1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tabela-rotas-privada-az1'

  PrivateRouteTableAz2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tabela-rotas-privada-az2'

  PrivateDefaultRouteAz1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableAz1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayAz1

  PrivateDefaultRouteAz2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableAz2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayAz2

  WebSubnetAz1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetAz1
      RouteTableId: !Ref PrivateRouteTableAz1

  BackendSubnetAz1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref BackendSubnetAz1
      RouteTableId: !Ref PrivateRouteTableAz1

  WebSubnetAz2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetAz2
      RouteTableId: !Ref PrivateRouteTableAz2

  BackendSubnetAz2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref BackendSubnetAz2
      RouteTableId: !Ref PrivateRouteTableAz2

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite SSH da estacao administrativa ao bastion
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-bastion'

  PrivateSshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite SSH e SFTP nas instancias privadas somente pelo bastion
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-ssh-privado'

  SwarmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite comunicacao interna entre os nos Docker Swarm
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-docker-swarm'

  SwarmManagementIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: tcp
      FromPort: 2377
      ToPort: 2377
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  SwarmDiscoveryTcpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: tcp
      FromPort: 7946
      ToPort: 7946
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  SwarmDiscoveryUdpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: udp
      FromPort: 7946
      ToPort: 7946
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  SwarmOverlayIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SwarmSecurityGroup
      IpProtocol: udp
      FromPort: 4789
      ToPort: 4789
      SourceSecurityGroupId: !Ref SwarmSecurityGroup

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite HTTP da internet ao ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-alb'

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite HTTP do ALB aos frontends
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-web'

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite acesso dos frontends aos backends
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-backend'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite MySQL somente a partir dos backends
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg-banco'

  BastionInstance:
    Type: AWS::EC2::Instance
    DependsOn: InternetGatewayAttachment
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref BastionSecurityGroup
          SubnetId: !Ref PublicSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-bastion-az1'

  BastionEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref BastionInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ip-elastico-bastion'

  SwarmManagerInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - BackendSubnetAz1RouteTableAssociation
      - PrivateDefaultRouteAz1
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref BackendSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-swarm-manager-az1'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y awscli curl docker.io openssh-server

          hostnamectl set-hostname swarm-manager-az1
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          PRIVATE_IP=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/meta-data/local-ipv4)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            docker swarm init --advertise-addr "$PRIVATE_IP"
          fi

          MANAGER_NODE_ID=$(docker info --format '{{.Swarm.NodeID}}')
          docker node update \
            --availability drain \
            --label-add tier=manager \
            --label-add zone=az1 \
            "$MANAGER_NODE_ID"

          WORKER_TOKEN=$(docker swarm join-token --quiet worker)
          aws ssm put-parameter \
            --region "$REGION" \
            --name '/${EnvironmentName}/swarm/worker-token' \
            --type SecureString \
            --value "$WORKER_TOKEN" \
            --overwrite

          cat > /usr/local/sbin/label-swarm-workers <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          ALL_WORKERS_READY=true

          while read -r NODE_NAME TIER ZONE; do
            NODE_ID=$(docker node ls --filter "name=$NODE_NAME" --format '{{.ID}}' | head -n 1)

            if [ -z "$NODE_ID" ]; then
              ALL_WORKERS_READY=false
              continue
            fi

            docker node update \
              --label-add "tier=$TIER" \
              --label-add "zone=$ZONE" \
              "$NODE_ID"
          done <<'NODES'
          web-az1 web az1
          web-az2 web az2
          backend-az1 backend az1
          backend-az2 backend az2
          NODES

          if [ "$ALL_WORKERS_READY" != true ]; then
            exit 1
          fi
          SCRIPT

          chmod 750 /usr/local/sbin/label-swarm-workers

          cat > /etc/systemd/system/label-swarm-workers.service <<'SERVICE'
          [Unit]
          Description=Aplica labels aos workers do Docker Swarm
          After=docker.service
          Requires=docker.service
          StartLimitIntervalSec=0

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/label-swarm-workers
          Restart=on-failure
          RestartSec=15

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable label-swarm-workers.service
          systemctl start label-swarm-workers.service || true

  BackendInstanceAz1:
    Type: AWS::EC2::Instance
    DependsOn:
      - SwarmManagementIngress
      - SwarmDiscoveryTcpIngress
      - SwarmDiscoveryUdpIngress
      - SwarmOverlayIngress
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref BackendSecurityGroup
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref BackendSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-backend-az1'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y awscli curl docker.io openssh-server

          hostnamectl set-hostname backend-az1
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            for attempt in $(seq 1 90); do
              if WORKER_TOKEN=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/worker-token' \
                --with-decryption \
                --query Parameter.Value \
                --output text 2>/dev/null); then
                if docker swarm join \
                  --token "$WORKER_TOKEN" \
                  '${SwarmManagerInstance.PrivateIp}:2377'; then
                  break
                fi
              fi

              sleep 10
            done
          fi

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "Nao foi possivel adicionar backend-az1 ao Docker Swarm." >&2
            exit 1
          fi

  BackendInstanceAz2:
    Type: AWS::EC2::Instance
    DependsOn:
      - SwarmManagementIngress
      - SwarmDiscoveryTcpIngress
      - SwarmDiscoveryUdpIngress
      - SwarmOverlayIngress
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref BackendSecurityGroup
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref BackendSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-backend-az2'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y awscli curl docker.io openssh-server

          hostnamectl set-hostname backend-az2
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            for attempt in $(seq 1 90); do
              if WORKER_TOKEN=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/worker-token' \
                --with-decryption \
                --query Parameter.Value \
                --output text 2>/dev/null); then
                if docker swarm join \
                  --token "$WORKER_TOKEN" \
                  '${SwarmManagerInstance.PrivateIp}:2377'; then
                  break
                fi
              fi

              sleep 10
            done
          fi

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "Nao foi possivel adicionar backend-az2 ao Docker Swarm." >&2
            exit 1
          fi

  DatabaseDataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt BackendSubnetAz2.AvailabilityZone
      Size: 20
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-volume-dados-banco-az2'

  DatabaseInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref DatabaseSecurityGroup
            - !Ref PrivateSshSecurityGroup
          SubnetId: !Ref BackendSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-banco-az2'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io

          systemctl enable --now docker
          usermod -aG docker ubuntu

          EBS_VOLUME_ID=$(printf '%s' '${DatabaseDataVolume}' | tr -d '-')
          DEVICE=""

          for attempt in $(seq 1 60); do
            for candidate in "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$EBS_VOLUME_ID" /dev/xvdf /dev/sdf; do
              if [ -b "$candidate" ]; then
                DEVICE="$candidate"
                break 2
              fi
            done
            sleep 5
          done

          if [ -z "$DEVICE" ]; then
            echo "O volume EBS nao foi encontrado apos 300 segundos." >&2
            exit 1
          fi

          if ! blkid "$DEVICE" >/dev/null 2>&1; then
            mkfs.ext4 "$DEVICE"
          fi

          EBS_UUID=$(blkid -s UUID -o value "$DEVICE")
          mkdir -p /var/lib/mysql

          if ! grep -q "UUID=$EBS_UUID /var/lib/mysql " /etc/fstab; then
            echo "UUID=$EBS_UUID /var/lib/mysql ext4 defaults,nofail 0 2" >> /etc/fstab
          fi

          mountpoint -q /var/lib/mysql || mount /var/lib/mysql

          DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server
          systemctl enable --now mysql

  DatabaseDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref DatabaseInstance
      VolumeId: !Ref DatabaseDataVolume

  WebInstanceAz1:
    Type: AWS::EC2::Instance
    DependsOn:
      - SwarmManagementIngress
      - SwarmDiscoveryTcpIngress
      - SwarmDiscoveryUdpIngress
      - SwarmOverlayIngress
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref WebSecurityGroup
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref WebSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-web-az1'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y awscli curl docker.io openssh-server

          hostnamectl set-hostname web-az1
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            for attempt in $(seq 1 90); do
              if WORKER_TOKEN=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/worker-token' \
                --with-decryption \
                --query Parameter.Value \
                --output text 2>/dev/null); then
                if docker swarm join \
                  --token "$WORKER_TOKEN" \
                  '${SwarmManagerInstance.PrivateIp}:2377'; then
                  break
                fi
              fi

              sleep 10
            done
          fi

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "Nao foi possivel adicionar web-az1 ao Docker Swarm." >&2
            exit 1
          fi

  WebInstanceAz2:
    Type: AWS::EC2::Instance
    DependsOn:
      - SwarmManagementIngress
      - SwarmDiscoveryTcpIngress
      - SwarmDiscoveryUdpIngress
      - SwarmOverlayIngress
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref WebSecurityGroup
            - !Ref PrivateSshSecurityGroup
            - !Ref SwarmSecurityGroup
          SubnetId: !Ref WebSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vm-web-az2'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y awscli curl docker.io openssh-server

          hostnamectl set-hostname web-az2
          systemctl enable docker
          systemctl restart docker
          systemctl enable --now ssh
          usermod -aG docker ubuntu

          IMDS_TOKEN=$(curl --fail --silent --show-error --request PUT \
            --header "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)
          REGION=$(curl --fail --silent --show-error \
            --header "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/dynamic/instance-identity/document \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["region"])')

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
            for attempt in $(seq 1 90); do
              if WORKER_TOKEN=$(aws ssm get-parameter \
                --region "$REGION" \
                --name '/${EnvironmentName}/swarm/worker-token' \
                --with-decryption \
                --query Parameter.Value \
                --output text 2>/dev/null); then
                if docker swarm join \
                  --token "$WORKER_TOKEN" \
                  '${SwarmManagerInstance.PrivateIp}:2377'; then
                  break
                fi
              fi

              sleep 10
            done
          fi

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "Nao foi possivel adicionar web-az2 ao Docker Swarm." >&2
            exit 1
          fi

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetAz1
        - !Ref PublicSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb'

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-web-tg'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref Vpc
      HealthCheckPath: /
      Targets:
        - Id: !Ref WebInstanceAz1
          Port: 80
        - Id: !Ref WebInstanceAz2
          Port: 80
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-grupo-destino-web'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

Outputs:
  ApplicationUrl:
    Description: URL HTTP publica do Application Load Balancer.
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  BastionPublicIp:
    Description: Endereco IP publico fixo do bastion para acesso SSH.
    Value: !Ref BastionEip

  SwarmManagerPrivateIp:
    Description: Endereco IP privado do manager Docker Swarm.
    Value: !GetAtt SwarmManagerInstance.PrivateIp

  SwarmManagerSshCommand:
    Description: Comando base para acessar o manager pelo bastion.
    Value: !Sub 'ssh -i <chave.pem> -J ubuntu@${BastionEip} ubuntu@${SwarmManagerInstance.PrivateIp}'

  SwarmManagerSftpCommand:
    Description: Comando base para enviar arquivos ao manager pelo bastion.
    Value: !Sub 'sftp -i <chave.pem> -o ProxyJump=ubuntu@${BastionEip} ubuntu@${SwarmManagerInstance.PrivateIp}'

  DatabasePrivateIp:
    Description: Endereco IP privado da instancia EC2 do banco de dados.
    Value: !GetAtt DatabaseInstance.PrivateIp